<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#145c31"
    >

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo-reciclagem.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <title>Login | EcoMaps</title>
</head>

<body>

    <div class="auth-page">

        <!-- =====================================================
             ÁREA VISUAL
             ===================================================== -->

        <div class="auth-visual">

            <a class="brand" href="index.html">
                <img
                    src="assets/logo.png"
                    alt="EcoMaps"
                >
            </a>

            <div>

                <span class="eyebrow">
                    Bem-vindo de volta
                </span>

                <h1>
                    Continue fazendo escolhas que fazem bem ao planeta.
                </h1>

                <p>
                    Entre para acessar sua conta do EcoMaps.
                </p>

            </div>

            <span class="auth-quote">
                “Deixe o planeta mais saudável.”
            </span>

        </div>


        <!-- =====================================================
             ÁREA DE LOGIN
             ===================================================== -->

        <main class="auth-box">

            <!-- Logo para dispositivos móveis -->
            <a
                class="mobile-brand brand"
                href="index.html"
            >
                <img
                    src="assets/logo.png"
                    alt="EcoMaps"
                >
            </a>


            <!-- Voltar para a página inicial -->
            <a
                class="back-link"
                href="index.html"
            >
                ← Voltar para o início
            </a>


            <!-- Título -->
            <h1>
                Fazer login
            </h1>

            <p class="auth-subtitle">
                Acesse sua conta para continuar.
            </p>


            <!-- =================================================
                 FORMULÁRIO DE LOGIN
                 ================================================= -->

            <form
                id="form-login"
                class="form auth-form"
                novalidate
            >

                <!-- E-mail -->
                <label for="login-email">
                    E-mail
                </label>

                <input
                    id="login-email"
                    class="input"
                    name="email"
                    type="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >


                <!-- Senha -->
                <label for="login-senha">
                    Senha
                </label>

                <input
                    id="login-senha"
                    class="input"
                    name="senha"
                    type="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >


                <!-- Mensagem de erro/sucesso -->
                <p
                    id="mensagem-login"
                    class="mensagem-form"
                    role="alert"
                    hidden
                ></p>


                <!-- Botão -->
                <button
                    class="btn btn-principal"
                    type="submit"
                >
                    Entrar
                </button>

            </form>


            <!-- Link para cadastro -->
            <p class="cadastro-link">
                Ainda não possui conta?
                <a href="cadastro.html">
                    Criar conta
                </a>
            </p>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
