<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EcoMaps</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="menu-top">
        <button class="fechar" type="button" onclick="fecharMenu()" aria-label="Fechar menu">✕</button>
      </div>
      <nav>
        <a href="index.html"><span>🏠</span><small>Início</small></a>
        <a href="sobre.html"><span>ℹ️</span><small>Sobre</small></a>
        <a href="perfil.html" class="ativo"><span>👤</span><small>Conta</small></a>
      </nav>
    </aside>

    <header>
      <div class="logo">
        <img src="assets/logo.png" alt="Logo EcoMaps">
        <h3>EcoMaps</h3>
      </div>
      <button class="menu-btn" type="button" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>
    </header>

    <main class="container auth-container">
      <h1 class="titulo">Faça seu login</h1>

      <form id="form-login" class="form auth-form" novalidate>
        <label for="login-email">E-mail</label>
        <input id="login-email" class="input" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

        <label for="login-senha">Senha</label>
        <input id="login-senha" class="input" name="senha" type="password" placeholder="Sua senha" autocomplete="current-password" required>

        <p id="mensagem-login" class="mensagem-form" role="alert" hidden></p>

        <button class="btn btn-principal" type="submit">Entrar</button>
      </form>

      <p class="cadastro-link">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </main>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
