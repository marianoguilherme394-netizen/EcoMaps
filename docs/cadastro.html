<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#145c31"
    >

    <link rel="icon" href="assets/logo-reciclagem.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <title>Cadastro | EcoMaps</title>

</head>


<body>

    <div class="auth-page">


        <!-- =====================================================
             ÁREA VISUAL
             ===================================================== -->

        <div class="auth-visual signup">

            <!-- Logo -->
            <a
                class="brand"
                href="index.html"
            >
                <img
                    src="assets/logo.png"
                    alt="EcoMaps"
                >
            </a>


            <!-- Texto principal -->
            <div>

                <span class="eyebrow">
                    Faça parte
                </span>

                <h1>
                    Uma conta simples para uma experiência melhor.
                </h1>

                <p>
                    Salve seus dados e acompanhe sua experiência no EcoMaps.
                </p>

            </div>


            <!-- Frase -->
            <span class="auth-quote">
                ♻️ Pequenas ações, grande impacto.
            </span>

        </div>


        <!-- =====================================================
             ÁREA DE CADASTRO
             ===================================================== -->

        <main class="auth-box">


            <!-- Logo para dispositivos móveis -->
            <a
                class="mobile-brand brand"
                href="index.html"
            >
                <img
                    src="assets/logo.png"
                    alt="EcoMaps"
                >
            </a>


            <!-- Voltar para a página inicial -->
            <a
                class="back-link"
                href="index.html"
            >
                ← Voltar para o início
            </a>


            <!-- Título -->
            <h1>
                Criar conta
            </h1>

            <p class="auth-subtitle">
                Leva menos de um minuto.
            </p>


            <!-- =================================================
                 FORMULÁRIO DE CADASTRO
                 ================================================= -->

            <form
                id="form-cadastro"
                class="form auth-form"
                novalidate
            >


                <!-- Nome -->
                <label for="cadastro-nome">
                    Nome completo
                </label>

                <input
                    id="cadastro-nome"
                    class="input"
                    name="nome"
                    type="text"
                    placeholder="Seu nome completo"
                    minlength="3"
                    maxlength="120"
                    autocomplete="name"
                    required
                >


                <!-- E-mail -->
                <label for="cadastro-email">
                    E-mail
                </label>

                <input
                    id="cadastro-email"
                    class="input"
                    name="email"
                    type="email"
                    placeholder="seuemail@exemplo.com"
                    maxlength="190"
                    autocomplete="email"
                    required
                >


                <!-- Senha -->
                <label for="cadastro-senha">
                    Senha
                </label>

                <input
                    id="cadastro-senha"
                    class="input"
                    name="senha"
                    type="password"
                    placeholder="Crie uma senha"
                    minlength="6"
                    maxlength="72"
                    autocomplete="new-password"
                    required
                >


                <!-- Confirmar senha -->
                <label for="cadastro-confirmar-senha">
                    Confirmar senha
                </label>

                <input
                    id="cadastro-confirmar-senha"
                    class="input"
                    type="password"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    maxlength="72"
                    autocomplete="new-password"
                    required
                >


                <!-- Mensagem de erro/sucesso -->
                <p
                    id="mensagem-cadastro"
                    class="mensagem-form"
                    role="alert"
                    hidden
                ></p>


                <!-- Botão -->
                <button
                    class="btn btn-principal"
                    type="submit"
                >
                    Criar minha conta
                </button>

            </form>


            <!-- Link para login -->
            <p class="cadastro-link">

                Já possui conta?

                <a href="login.html">
                    Fazer login
                </a>

            </p>

        </main>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
