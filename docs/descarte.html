<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa de descarte | EcoMaps</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app-shell">

  <header class="site-header">

    <a class="brand" href="index.html" aria-label="EcoMaps - início">
      <img src="assets/logo.png" alt="EcoMaps">
    </a>

    <nav class="desktop-nav" aria-label="Navegação principal">
      <a class="nav-link" href="index.html">Início</a>

      <a class="nav-link active" href="descarte.html">
        Encontrar ponto
      </a>

      <a class="nav-link" href="sobre.html">Sobre</a>

      <a class="nav-link" href="perfil.html">Minha conta</a>
    </nav>

    <button
      class="menu-btn"
      type="button"
      onclick="abrirMenu()"
      aria-label="Abrir menu"
    >
      ☰
    </button>

  </header>


  <!-- MENU MOBILE -->

  <div
    class="overlay"
    id="overlay"
    onclick="fecharMenu()"
  ></div>

  <aside
    class="sidebar"
    id="sidebar"
    aria-label="Menu mobile"
  >

    <div class="sidebar-head">

      <strong>EcoMaps</strong>

      <button
        class="fechar"
        onclick="fecharMenu()"
        aria-label="Fechar menu"
      >
        ✕
      </button>

    </div>

    <nav>

      <a href="index.html">
        🏠 <span>Início</span>
      </a>

      <a class="ativo" href="descarte.html">
        📍 <span>Encontrar ponto</span>
      </a>

      <a href="sobre.html">
        🌱 <span>Sobre o projeto</span>
      </a>

      <a href="perfil.html">
        👤 <span>Minha conta</span>
      </a>

      <a href="admin.html" id="link-admin" style="display: none;">🛠️ <span>Area ADM</span></a>

    </nav>

  </aside>

    <!-- CONTEÚDO -->
    <main class="descarte-page">

        <h1>
            Encontre um ponto perto de você
        </h1>

        <!-- PESQUISA -->
        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                type="text"
                id="campoBusca"
                placeholder="Ex.: celular, pilhas, vidro..."
            >

            <button id="btnBuscar">
                Buscar
            </button>

        </div>

        <!-- FILTROS -->
        <div class="filtros">

            <button class="filtro ativo">
                Todos
            </button>

            <button class="filtro">
                Mais próximos
            </button>

            <button class="filtro">
                Abertos
            </button>

        </div>

        <p class="contador" id="contador-pontos">
    Carregando ecopontos...
</p>

        <!-- PONTOS -->
        <section class="lista-pontos" id="lista-pontos">

        

    </main>

</div>
</div>

<script src="js/menu.js"></script>
<script src="js/descarte.js"></script>
</body>
</html>
